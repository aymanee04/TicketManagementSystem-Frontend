<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4">
  <div class="max-w-md w-full text-center">
    <div class="mb-8">
      <lucide-icon name="ban" class="mx-auto text-red-600 mb-4" [size]="48"></lucide-icon>
      <h1 class="text-4xl font-bold text-gray-900 mb-2">Access Denied</h1>
      <p class="text-gray-600 mb-6">You don't have permission to access this page.</p>
    </div>

    <div class="space-y-3">
      <button
        (click)="goBack()"
        class="w-full px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
      >
        <lucide-icon name="arrowLeft" class="mr-2" [size]="18"></lucide-icon>
        Go Back
      </button>
      <button
        (click)="goHome()"
        class="w-full px-6 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors"
      >
        Go to Dashboard
      </button>
    </div>
  </div>
</div>
